<!DOCTYPE html>
<html>
<head>
	<title>Smart Roundabout Viewer</title>
	<style>
		body { 
			background-color: #111; 
			color: white; 
			font-family: Arial, sans-serif; 
			display: flex; 
			align-items: flex-start; /* prevent canvas stretching */
			padding: 20px;
		}
		#dashboard { 
			flex: 0 1 760px;
			width: 760px; /* slightly wider to fit single-line stats */
			height: calc(100vh - 40px); /* almost as tall as viewport */
			max-height: none;
			overflow-x: hidden;
			overflow-y: auto; /* adds scrollbar if too many items */
			margin-right: 20px; 
			background: #222; 
			padding: 15px; 
			border-radius: 8px; 
			border: 1px solid #444; 
			box-sizing: border-box;
		}
		#dashboard-content {
			display: grid;
			grid-template-columns: minmax(400px, 2fr) minmax(220px, 1fr);
			gap: 20px;
		}
		.dashboard-column {
			min-width: 0;
		}
		@media (max-width: 1100px) {
			body {
				flex-direction: column;
			}
			#dashboard {
				width: 100%;
				min-width: 0;
				max-width: none;
				margin-right: 0;
				margin-bottom: 20px;
			}
			#dashboard-content {
				grid-template-columns: 1fr 1fr;
			}
			canvas {
				max-width: 100%;
				height: auto;
			}
		}
		canvas { 
			width: 900px;
			height: 900px;
			flex: 0 0 900px;
			background-color: #222;
			border: 2px solid #555;
			border-radius: 8px;
			box-sizing: border-box;
		}
		.hud-line { 
			margin: 5px 0; 
			font-size: 13px; 
			font-family: monospace; 
			border-bottom: 1px solid #333; 
			padding-bottom: 5px;
			white-space: nowrap;
		}
		.status-NORMAL { color: #00ff00; }
		.status-FAILSAFE { color: #ff9900; }
		.status-DISCONNECTED { color: #ff3333; }
	</style>
</head>
<body>
	<div id="dashboard">
		<div id="vehicle-count" class="hud-line"></div>

		<div id="dashboard-content">
			<div class="dashboard-column">
				<h2>Live Telemetry</h2>
				<hr style="border-color: #444;">
				<div id="telemetry-list"></div>

				<h3>Precedence Queue</h3>
				<div id="precedence-queue"></div>
			</div>

			<div class="dashboard-column">
				<h2>Collisions</h2>
				<hr style="border-color: #444;">
				<div id="collision-list"></div>
			</div>
		</div>
	</div>

	<canvas id="simCanvas" width="900" height="900"></canvas>

	<script>
		const STATE_FETCH_MS = 1000 / 15.0;
		
		const canvas   		= document.getElementById("simCanvas");
		const ctx      		= canvas.getContext("2d");
		const telemetryList = document.getElementById("telemetry-list");

		// center of canvas
		const offsetX = 450;
		const offsetY = 450;

		let sysConfig = null;

		async function fetchConfig() {
			const response	= await fetch('/api/config');
			sysConfig		= await response.json();
		}


		let isPaused = false;

		window.addEventListener('keydown', async (e) => {
			if (e.code === 'Space') {
				e.preventDefault();	// stop the page from scrolling down
				isPaused = !isPaused; // toggle state
				
				const cmd = isPaused ? "PAUSE" : "RESUME";
				await fetch('/api/control', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ command: cmd })
				});
			}
		});


		async function fetchStateAndDraw() {
			// get config once on load
			if (!sysConfig) await fetchConfig();

			try {
				const response			= await fetch('/api/state');
				const state				= await response.json();
				const vehicles			= state.vehicles;
				const totVSpawned		= state.tot_vehicles_spawned;
				const collisions		= state.collisions ?? [];
				const precedenceQueue	= state.precedence_queue;

				const vehicleIds	= Object.keys(vehicles).sort();
				const vehicleOrder	= new Map(
					vehicleIds.map((id, index) => [id, index])
				);


				document.getElementById("vehicle-count").textContent =
   					`Total spawned: ${totVSpawned}`;

				const collisionHtml = collisions.length === 0
					? "<div class=\"hud-line\">None</div>"
					: [...collisions].reverse().map(collision => {
						const time = new Date(collision.timestamp * 1000)
							.toLocaleTimeString("en-GB", {
								hour12: false,
								hour: "2-digit",
								minute: "2-digit",
								second: "2-digit"
							});

						const id1 = collision.v1_id.substring(0, 4);
						const id2 = collision.v2_id.substring(0, 4);

						return `
							<div class="hud-line">
								{${time} ${id1}-${id2}}
							</div>
						`;
					}).join("");

				document.getElementById("collision-list").innerHTML = collisionHtml;
					

				// clear the screen
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				// scaled sizes
				const sRadius	= sysConfig.r_radius * sysConfig.scale;
				const sLaneW	= sysConfig.lane_width * sysConfig.scale;
				const roadWidth = sLaneW * 2;
				
				// draw each road
				for (let i = 0; i < sysConfig.n_roads; i++) {
					let angle = (2 * Math.PI / sysConfig.n_roads) * i;
					
					ctx.save();
					ctx.translate(offsetX, offsetY);
					// negative angle (html draws Y inverted)
    				ctx.rotate(-angle); 
					
					// asphalt
					ctx.fillStyle = "#4a4a4a";
					ctx.fillRect(sRadius, -roadWidth/2, 1000, roadWidth);
					
					// dashed center line
					ctx.beginPath();
					ctx.setLineDash([15, 15]);
					ctx.moveTo(sRadius, 0);
					ctx.lineTo(1000, 0);
					ctx.strokeStyle = "#ffeb3b";
					ctx.lineWidth = 2;
					ctx.stroke();
					
					ctx.restore();
				}

				// draw roundabout
				ctx.beginPath();
				ctx.setLineDash([]);
				ctx.arc(offsetX, offsetY, sRadius + (sLaneW/2), 0, 2 * Math.PI);
				ctx.strokeStyle = "#4a4a4a";
				ctx.lineWidth = roadWidth;
				ctx.stroke();

				// roundabout outer border
				ctx.beginPath();
				ctx.arc(offsetX, offsetY, sRadius - (sLaneW/2), 0, 2 * Math.PI);
				ctx.strokeStyle = "white";
				ctx.lineWidth = 2;
				ctx.stroke();

				// roundabout inner island border
				ctx.beginPath();
				ctx.arc(offsetX, offsetY, sRadius - sLaneW, 0, 2 * Math.PI);
				ctx.strokeStyle = "white";
				ctx.lineWidth = 2;
				ctx.stroke();

				// draw each car
				for (let vehicle_id in vehicles) {
					let v = vehicles[vehicle_id];
					
					// car.x and car.y are the logical coordinates.
					// We add offsetX and offsetY to place them correctly on the screen's rectangle
					let drawX	= (v.pos.x * sysConfig.scale) + offsetX;
					// subtract Y so positive Y goes UP on the screen (to match simulation)
					let drawY	= offsetY - (v.pos.y * sysConfig.scale);	
					let vLen	= sysConfig.car_length * sysConfig.scale;
					let vWid	= sysConfig.car_width * sysConfig.scale;

					ctx.save();
					ctx.translate(drawX, drawY);

					// calculate rotation angle based on state (neg angle, html draws Y inverted)
					let drawAngle = -v.pos_angle;
					if (v.nav_state === "APPROACHING")		drawAngle -= Math.PI;		// point towards center
					if (v.nav_state === "IN_ROUNDABOUT")	drawAngle -= Math.PI / 2;	// tangent to circle
					
					ctx.rotate(drawAngle);
					
					// rectangle body
					const lightness = v.color_lightness_perc ?? 50;
					const vColor = `hsl(${v.color_hue}, 100%, ${lightness}%)`;
					ctx.fillStyle = vColor;
					ctx.fillRect(-vLen/2, -vWid/2, vLen, vWid);

					// windshield (to show front direction clearly)
					ctx.fillStyle = "#111";
					ctx.fillRect((vLen/2) - 4, -vWid/2 + 1, 3, vWid - 2);

					ctx.restore();

					// car ID text
					const vStateSym	= v.state === "FAILSAFE" ? "!" : v.state === "DISCONNECTED" ? "?" : "";
					const vAccSign	= v.acceleration > 0 ? "+" : v.acceleration < 0 ? "-" : "=";
					const vLabel 	= `${vStateSym}${vehicle_id.substring(0, 4)}-${Math.round(v.speed)}${vAccSign}`;

					ctx.font		= "11px monospace";
					const labelW	= ctx.measureText(vLabel).width + 8;

					// randomize label position to reduce overlaps, but don't make flicker
					// (so deterministic based on vehicle ID)
					const labelOffsets = [
						[vLen / 2 + 8, -vWid / 2],
						[vLen / 2 + 8, vWid / 2 + 14],
						[-vLen / 2 - labelW - 8, -vWid / 2],
						[-vLen / 2 - labelW - 8, vWid / 2 + 14],
					];
					const offsetIndex = vehicleOrder.get(vehicle_id) % labelOffsets.length;
					const [offsetLabelX, offsetLabelY] = labelOffsets[offsetIndex];

					const labelX = drawX + offsetLabelX;
					const labelY = drawY + offsetLabelY;

					ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
					ctx.fillRect(labelX - 4, labelY - 10, labelW, 14);

					ctx.fillStyle = vColor;
					ctx.fillText(vLabel, labelX, labelY);
				}

				/*
				 * info (legend, telemetry)
				 */
				/*
				const nVehicles = Object.keys(vehicles).length;
				const boxHeight = 35 + (nVehicles * 20);

				ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
				ctx.fillRect(10, 10, 320, boxHeight);

				// dashboard title
				ctx.fillStyle = "white";
				ctx.font = "bold 14px monospace";
				ctx.fillText("LIVE TELEMETRY", 20, 30);

				// separating line
				ctx.beginPath();
				ctx.moveTo(15, 38);
				ctx.lineTo(320, 38);
				ctx.strokeStyle = "gray";
				ctx.lineWidth = 1;
				ctx.stroke();
				*/

				const queueHtml = precedenceQueue.length === 0
					? "<div class=\"hud-line\">Empty</div>"
					: precedenceQueue.map((vehicleId, index) => `
						<div class="hud-line">
							<strong>#${index + 1}</strong>
							${vehicleId.substring(0, 4)}
						</div>
					`).join("");

				document.getElementById("precedence-queue").innerHTML = `
						${queueHtml}
				`;
				
				// list each vehicle's stats
				let htmlContent = "";
				for (let vehicle_id in vehicles) {
					let v		= vehicles[vehicle_id];
					let shortId = vehicle_id.substring(0, 4);
					
					let speedStr	= v.speed.toFixed(1).padStart(4, '0');
					let accStr = (v.acceleration > 0 ? "+" : "") + v.acceleration.toFixed(1).padStart(4, '0');
					let navStr = "APP";
					if (v.nav_state === "IN_ROUNDABOUT") navStr = "RND";
					if (v.nav_state === "EXITING") navStr = "EXI";
					
					let stateClass = `status-${v.state}`;
					let stateShort =
						v.state === "NORMAL" ? "NORM"
						: v.state === "DISCONNECTED" ? "DISC"
						: "FAIL";

					const speedColor = v.speed == 0
						? "#ff3333"
						: v.speed == v.params.max_speed
							? "#00ff00"
							: "white";
					const accColor = v.acceleration < 0
						? "#ff3333"
						: v.acceleration > 0
							? "#00ff00"
							: "white";

					const queueIndex	= precedenceQueue.indexOf(vehicle_id);
					const queuePosition = queueIndex >= 0
						? ` #${queueIndex + 1}`
						: "";
					
					htmlContent += `
						<div class="hud-line">
							<!-- Colored ID matching the car -->
							<strong style="color: hsl(${v.color_hue}, 100%, 70%)">[${shortId}]</strong> 
							<span class="${stateClass}">${stateShort}</span> | 
							S:<span style="color: ${speedColor}">${speedStr}</span> A:<span style="color: ${accColor}">${accStr}</span> | 
							${navStr} (${v.entry_road}➔${v.exit_road})${queuePosition}
						</div>`;
				}
				telemetryList.innerHTML = htmlContent;

				
				if (isPaused) {
					ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					
					ctx.fillStyle = "white";
					ctx.font = "bold 48px Arial";
					ctx.textAlign = "center";
					ctx.fillText("PAUSED", canvas.width / 2, canvas.height);
					ctx.textAlign = "left"; // reset for next frame
				}
				
			} catch (err) {
				console.error("Error fetching state:", err);
			}

			setTimeout(fetchStateAndDraw, STATE_FETCH_MS);
		}

		fetchStateAndDraw();
	</script>
</body>
</html>
